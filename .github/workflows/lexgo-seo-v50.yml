name: 'Lex Go Trámite — Daily Knowledge Article (NO PUBLICATION)'

on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
    inputs:
      retry_failed_topic:
        description: 'Manually retry a draft attempted today (never bypass legal checks)'
        type: boolean
        default: false
        required: false
      allow_editorial_fallback:
        description: 'Allow a clearly labeled renewal seed when no eligible measured keyword exists'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: lexgo-seo-engine-v50
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact selected commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official PDF text extractor
        run: python -m pip install 'pypdf==5.9.0' 'jsonschema==4.26.0'
      - name: Validate v5 and upstream components
        run: |
          python -m unittest discover -s tests -p 'test_seo_v50.py' -v
          python -m unittest discover -s tests -p 'test_seo_v42.py' -v
          python -m unittest discover -s tests -p 'test_legal_content_v46.py' -v
          python -m unittest discover -s tests -p 'test_boe_universal_v45.py' -v
          # Historical long-term-TIE planning tests are superseded by the
          # six-category commercial-scope tests below; do not bypass safety gates.
          python -m unittest discover -s tests -p 'test_official_sources_v50.py' -v
          python -m unittest discover -s tests -p 'test_v50_temporary_commercial_focus.py' -v
          python -m unittest discover -s tests -p 'test_v50_rd316_boe_route.py' -v
          python -m unittest discover -s tests -p 'test_v50_regularization_guidance_pdf.py' -v
          python -m unittest discover -s tests -p 'test_v50_run35_branch_applicability.py' -v
          python -m unittest discover -s tests -p 'test_v50_run37_editorial_scope.py' -v
          python -m unittest discover -s tests -p 'test_v50_run38_gap_diagnostics.py' -v
          python -m unittest discover -s tests -p 'test_v50_run39_passages_scope.py' -v
          python -m unittest discover -s tests -p 'test_v50_run40_closed_selection.py' -v
          python -m unittest discover -s tests -p 'test_v50_run41_commercial_scope.py' -v
          python -m unittest discover -s tests -p 'test_v50_run42_scope_retries.py' -v
          python -m unittest discover -s tests -p 'test_v50_run43_branch_first.py' -v
          python -m unittest discover -s tests -p 'test_v50_run44_route_cardinality.py' -v
          python -m unittest discover -s tests -p 'test_v50_run45_missing_gap.py' -v
          python -m unittest discover -s tests -p 'test_v50_run46_shared_passages.py' -v
          python -m unittest discover -s tests -p 'test_v50_run47_review_target.py' -v
          python -m unittest discover -s tests -p 'test_v50_run48_review_consistency.py' -v
          python -m unittest discover -s tests -p 'test_v50_run49_gap_reference_repair.py' -v
          python -m unittest discover -s tests -p 'test_v50_run51_arraigo_research.py' -v
          python -m unittest discover -s tests -p 'test_v50_run52_coverage_consistency.py' -v
          python -m unittest discover -s tests -p 'test_v50_run53_employer_focus.py' -v
          python -m unittest discover -s tests -p 'test_v50_run54_self_employed_discovery.py' -v
          python -m unittest discover -s tests -p 'test_v50_run55_first_article.py' -v
          python -m unittest discover -s tests -p 'test_v50_run56_budget.py' -v
          python -m unittest discover -s tests -p 'test_v50_run57_live_research.py' -v
          python -m unittest discover -s tests -p 'test_v50_run58_editorial_seo.py' -v
          python -m unittest discover -s tests -p 'test_v50_run59_budget_settlement.py' -v
          python -m unittest discover -s tests -p 'test_v50_run60_official_instructions.py' -v
          python -m unittest discover -s tests -p 'test_v50_run61_source_context.py' -v
          python -m unittest discover -s tests -p 'test_v50_run62_renewal_intent.py' -v
          python -m unittest discover -s tests -p 'test_v50_run63_narrow_answer.py' -v
          python -m unittest discover -s tests -p 'test_v50_run65_content_system.py' -v
      - name: Refresh REAL Google Search Console data
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          set -eu
          : "${GSC_CLIENT_ID:?Missing GSC_CLIENT_ID}"
          : "${GSC_CLIENT_SECRET:?Missing GSC_CLIENT_SECRET}"
          : "${GSC_REFRESH_TOKEN:?Missing GSC_REFRESH_TOKEN}"
          : "${GSC_SITE_URL:?Missing GSC_SITE_URL}"
          python scripts/seo_intelligence.py
          test -s reports/seo_intelligence.json
      - name: Select topic using real demand and outcome history
        env:
          GH_HISTORY_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MANUAL_RETRY: ${{ inputs.retry_failed_topic }}
          EDITORIAL_FALLBACK: ${{ github.event_name == 'schedule' || inputs.allow_editorial_fallback }}
          LEXGO_KEYWORD_PLANNER_CSV: ${{ vars.LEXGO_KEYWORD_PLANNER_CSV }}
        shell: bash
        run: |
          set -eu
          ARGS=()
          if [ "$MANUAL_RETRY" = 'true' ]; then ARGS+=(--retry-failed); fi
          if [ "$EDITORIAL_FALLBACK" = 'true' ]; then ARGS+=(--allow-editorial-fallback); fi
          python scripts/seo_v50.py select --require-history "${ARGS[@]}"
      - name: Reserve shared daily budget before any paid request
        id: reserve
        if: hashFiles('reports/seo_v50/selected_proposal.json') != ''
        env:
          GH_HISTORY_TOKEN: ${{ github.token }}
          LEXGO_BUDGET_START: ${{ vars.LEXGO_BUDGET_START }}
          LEXGO_BUDGET_BALANCE_USD: ${{ vars.LEXGO_BUDGET_BALANCE_USD }}
          LEXGO_MONTHLY_DEBIT_USD: ${{ vars.LEXGO_MONTHLY_DEBIT_USD }}
        run: |
          python scripts/weekly_content_v50.py reserve daily reports/v65-budget/reservation.json
          python -c "import json,os; r=json.load(open('reports/v65-budget/reservation.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('allowed='+str(r['allowed']).lower()+'\n'+'usd='+str(r.get('reserved_usd',0))+'\n')"
      - name: Persist reservation before generation
        id: persist_reservation
        if: steps.reserve.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lexgo-content-reservation-v65
          path: reports/v65-budget/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Generate evidence-linked legal draft
        if: steps.reserve.outputs.allowed == 'true'
        id: draft
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEARCH_MODEL: 'gpt-6-luna'
          REVIEW_MODEL: 'gpt-6.1-terra'
          DAILY_USD: ${{ steps.reserve.outputs.usd }}
        shell: bash
        run: |
          if [ ! -s reports/seo_v50/selected_proposal.json ]; then
            echo 'No eligible research-backed topic. No AI call and no publication.'
            echo 'exit_code=0' >> "$GITHUB_OUTPUT"
          else
            if [ -z "$OPENAI_API_KEY" ]; then
              echo 'OpenAI credential missing: no draft generated.'
              echo 'exit_code=4' >> "$GITHUB_OUTPUT"
            else
              set +e
              python scripts/first_article_v50.py --proposal-file reports/seo_v50/selected_proposal.json --output reports/seo_v50/article --article-type specific_question --max-topics 1 --max-research-rounds 2 --max-draft-repairs 1 --max-execution-minutes 25 --max-api-cost-usd "$DAILY_USD" --research-model "$RESEARCH_MODEL" --review-model "$REVIEW_MODEL"
              CODE=$?
              set -e
              echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
              echo "Generator exit status: $CODE (0=review ready; nonzero=not review ready; inspect decision)"
            fi
          fi
      - name: Settle reserved budget
        if: always() && steps.persist_reservation.outcome == 'success'
        run: python scripts/weekly_content_v50.py settle reports/v65-budget/reservation.json reports/seo_v50/article/api_usage.json reports/v65-budget/settlement.json
      - name: Preserve budget settlement
        if: always() && hashFiles('reports/v65-budget/settlement.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lexgo-content-settlement-v65
          path: reports/v65-budget/settlement.json
          if-no-files-found: error
          retention-days: 90
      - name: Record ACTUAL draft outcome (not a publication)
        if: always() && hashFiles('reports/seo_v50/selection.json') != '' && (steps.reserve.outputs.allowed == 'true' || hashFiles('reports/seo_v50/selected_proposal.json') == '')
        run: python scripts/seo_v50.py finalize
      - name: Upload all diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexgo-v50-results
          path: |
            reports/seo_intelligence.json
            reports/seo_v50/**
            reports/v65-budget/**
          if-no-files-found: warn
          retention-days: 90
      - name: Explain outcome
        if: always()
        shell: bash
        run: |
          if [ -f reports/v65-budget/reservation.json ] && python -c "import json; exit(0 if json.load(open('reports/v65-budget/reservation.json'))['allowed'] is False else 1)"; then
            cat reports/v65-budget/reservation.json
            exit 0
          fi
          if [ -f reports/seo_v50/run_summary.json ]; then
            cat reports/seo_v50/run_summary.json
          else
            echo 'Preflight or selection failed; review the previous steps.'
            exit 1
          fi
          if [ -f reports/seo_v50/article/decision.json ]; then
            if python -c "import json; from pathlib import Path; d=json.loads(Path('reports/seo_v50/article/decision.json').read_text()); exit(1 if d.get('result') in ('ERROR','INFRASTRUCTURE_ERROR','BUDGET_EXHAUSTED') else 0)"; then
              echo 'Expected legal-validation blocks are reported, not misrepresented as publication.'
            else
              echo 'Infrastructure or AI request error: check the article decision artifact.'
              exit 1
            fi
          fi
          if [ -f reports/seo_v50/selected_proposal.json ] && [ ! -f reports/seo_v50/article/decision.json ]; then
            echo 'An eligible topic was selected but no generator decision was produced.'
            exit 1
          fi
          echo 'No publishing permissions exist in this workflow.'
