name: SEO v4 - official sources live preview (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lexgo-v4-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run v4 tests
        run: python -m unittest discover -s tests -p 'test_seo_v4_demo.py' -v
      - name: Pull fresh Search Console report
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          test -n "$GSC_CLIENT_ID" && test -n "$GSC_CLIENT_SECRET" && test -n "$GSC_REFRESH_TOKEN" && test -n "$GSC_SITE_URL" || { echo 'Missing Search Console secrets'; exit 1; }
          python scripts/seo_intelligence.py
      - name: Build v3 topic proposals
        run: python scripts/seo_content_v3.py
      - name: Fetch official sources and produce v4 preview artifacts
        run: python scripts/seo_v4_demo.py
      - name: Upload downloadable previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexgotramite-v4-official-source-preview
          path: |
            reports/seo_intelligence.json
            reports/seo_intelligence.md
            reports/editorial_v3/**
            reports/seo_v4_preview/**
          retention-days: 30
          if-no-files-found: warn
