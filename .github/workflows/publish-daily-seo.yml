name: 'Legacy daily publisher — DISABLED (NO PUBLICATION)'

# Intentionally manual, read-only and no-op. No scheduled publisher or push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publication disabled
        run: echo 'Automatic publication is disabled. Human review is required.'
